[package]
name = "dropkick"
version = "0.1.0"
description = "A local-first task manager built with Tauri"
authors = ["Yoshinao Inoguchi <nao7sep@gmail.com>"]
license = "MIT"
repository = "https://github.com/nao7sep/dropkick"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dropkick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.3"
# The write-through data-backup store. `bundled` compiles SQLite from source into
# the binary, so the store needs no system libsqlite3 and adds no packaging churn
# (the lowest-friction SQLite binding for the Rust core, per the data-backup
# conventions' "built-in or lowest-friction binding" rule).
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
# Serializes the tests that share the process-global backup-store singleton
# (`static STORE` in backup_store.rs). `cargo test` runs tests in parallel threads
# within one process, so the backup_store tests (which reset/reopen the singleton
# via `init`/`close_for_test` against throwaway roots) and the lib.rs atomic-write
# test (which reaches `backup_store::record` through `write_atomic`) would race
# over that one connection. `#[serial(backup_store)]` with a shared key makes that
# group mutually exclusive while unrelated tests still parallelize. Default
# features (async runtime + logging) are unused here; only the synchronous
# `#[serial]` attribute is needed.
serial_test = { version = "3.5", default-features = false }

