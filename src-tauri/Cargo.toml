[package]
name = "dropkick"
version = "0.1.0"
description = "Let tasks sort themselves by urgency, kick the ones you can't do yet down the list, and keep every list in plain JSON files."
authors = ["Yoshinao Inoguchi <yoshinao@inoguchi.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/nao7sep/dropkick"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Warnings are errors, on EVERY platform the app ships to — the gate this table exists for.
# It lives in the manifest rather than in CI or a RUSTFLAGS export so that one declaration
# covers `cargo check`, `cargo test`, `cargo build`, the local `npm test`, and CI alike;
# a gate only CI enforces is one every developer meets late, and a `cfg(windows)` warning is
# invisible to a macOS-only gate because that code is never compiled there.
[lints.rust]
warnings = "deny"
# The one exception, and it must be explicit or the gate fails every Windows build forever:
# the MSVC linker prints an informational note (localized — in Japanese on a ja_JP machine)
# saying it created an import library. That is the toolchain narrating, not a defect in this
# code, and nothing here can silence it at the source.
linker_messages = "allow"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dropkick_lib"
crate-type = ["rlib"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4.3"
# The write-through data-backup store. `bundled` compiles SQLite from source into
# the binary, so the store needs no system libsqlite3 and adds no packaging churn
# (the lowest-friction SQLite binding for the Rust core, per the data-backup
# conventions' "built-in or lowest-friction binding" rule).
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The computer's preferred languages, read once at launch (src/i18n.rs).
sys-locale = "0.3.2"
# The home directory, resolved exactly as Tauri's path resolver does, so the
# saved language can be read before Tauri builds the app.
dirs = "6.0.0"
# Watches the open task lists for edits made outside the app (src/file_watch.rs).
# The standard Rust watcher, the one Tauri's fs plugin is built on; the webview
# carries no fs plugin, so the core watches and tells the window.
notify = "8.2.0"

# AppKit's language is aligned with the interface language before the app is
# built (i18n::align_appkit).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSUserDefaults"] }

[dev-dependencies]
# Serializes the tests that share the process-global backup-store singleton
# (`static STORE` in backup_store.rs). `cargo test` runs tests in parallel threads
# within one process, so the backup_store tests (which reset/reopen the singleton
# via `init`/`close_for_test` against throwaway roots) and the lib.rs atomic-write
# test (which reaches `backup_store::record` through `write_atomic`) would race
# over that one connection. `#[serial(backup_store)]` with a shared key makes that
# group mutually exclusive while unrelated tests still parallelize. Default
# features (async runtime + logging) are unused here; only the synchronous
# `#[serial]` attribute is needed.
serial_test = { version = "3.5", default-features = false }
tempfile = "3.27"
